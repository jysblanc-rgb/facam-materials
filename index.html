<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>패캠 강의 자료실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800&display=swap">
<style>
body{background:#f2f3ef;color:#1a1a1a;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;font-weight:500;line-height:1.6;margin:0;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
*{box-sizing:border-box}
:root{--accent:#0f5c48;--line:#9aa095}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 56px;display:grid;gap:18px}
h1{font-weight:800;font-size:clamp(26px,6vw,34px);line-height:1.25;margin:0;letter-spacing:-.02em}
h2{font-weight:800;font-size:21px;margin:0 0 4px}
.sub{font-weight:500;color:#2e2e2e;margin:6px 0 0}
a{color:#0b4a39;font-weight:700}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px}

.item{display:block;text-decoration:none;color:inherit}
.code{display:inline-block;background:#e1efe9;color:#0b4a39;font-weight:800;border-radius:999px;padding:2px 12px;font-size:15px}
.item b{display:block;font-size:19px;margin:8px 0 2px}
.item span.d{display:block;color:#2e2e2e}
.go{display:inline-block;margin-top:8px;background:#0f5c48;color:#fff;font-weight:700;border-radius:999px;padding:8px 16px;min-height:44px;line-height:28px}
.go.alt{background:#fff;color:#0b4a39;border:2px solid #0f5c48;line-height:24px}
.row{display:flex;flex-wrap:wrap;gap:10px}
</style>
</head>
<body>
<main class="wrap">
<header>
<h1>패캠 강의 자료실</h1>
<p class="sub">강의 클립에서 「그대로 드릴게요」라고 한 자료를 클립 번호별로 모았어요.</p>
</header>

<section class="card">
<span class="code">00-03-02</span>
<h2>사전 준비물</h2>
<p class="sub">세 칸 준비물 목록 한 장이에요. 인쇄해서 체크해도 돼요.</p>
<div class="row"><a class="go" href="prep/">준비물 목록 열기</a></div>
</section>

<section class="card">
<span class="code">00-03-02</span>
<h2>연습용 자료 팩</h2>
<p class="sub">내 회사 자료가 없을 때 쓰는 가상 회사 예시 파일 5개예요. 전부 지어낸 가짜 자료예요.</p>
<div class="row">
<a class="go" href="pack/pack.zip">자료 팩 내려받기 (zip)</a>
<a class="go alt" href="pack/">파일 하나씩 보기</a>
</div>
</section>

<section class="card">
<span class="code">01-01-02</span>
<h2>AI 업무 시스템 진단</h2>
<p class="sub">다섯 영역 25칸을 체크하면 우리 회사 등급이 나와요.</p>
<div class="row"><a class="go" href="https://jysblanc-rgb.github.io/ai-work-diagnosis/">진단 도구 열기</a></div>
</section>
</main>
</body>
</html>
